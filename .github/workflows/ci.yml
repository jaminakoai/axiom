name: CI

on:
  push:
    branches: [main, master, develop]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Python sürümünü kur
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Sistem bağımlılıkları (clang, OpenSSL, zlib, pthread)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang libssl-dev zlib1g-dev

      - name: Python bağımlılıkları
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Sürüm bilgisi
        run: |
          clang --version | head -1
          python -c "import z3; print('z3', z3.get_version_string())"
          ./bin/axiom --version

      # `bin/axiomc` depoda tutulmaz; self-hosted/negatif-guvenlik testleri onu
      # bekledigi icin bootstrap testlerden ONCE calismali. (P1-03c §9, kok neden 1)
      - name: Bootstrap (self-hosted derleyici)
        run: make bootstrap

      - name: Sabitlenmiş gerçek YARA corpus diferansiyel testi
        run: python -m pytest -q tests/test_yara_corpus_compat.py tests/test_yara_condition_differential.py

      - name: Test paketi
        run: python -m pytest -q --no-header

      - name: Dokümantasyon kod blokları
        run: python -m pytest -q tests/test_tutorial_examples.py tests/test_specification.py tests/test_docs_en.py tests/test_docgen.py

  sanitizers:
    name: ASan/UBSan + bellek sızıntısı
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Bağımlılıklar
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang libssl-dev zlib1g-dev
          python -m pip install -e ".[dev]"
      - name: Bootstrap (self-hosted derleyici)
        run: make bootstrap

      - name: Bellek güvenliği testleri
        run: |
          python -m pytest -q tests/test_memory_leak_deep.py \
                               tests/test_negative_security.py \
                               tests/test_security_audit_fixes.py \
                               tests/test_runtime_ownership_audit.py

  llvm:
    name: LLVM arka ucu + DWARF
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Bağımlılıklar
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang llvm binutils libssl-dev zlib1g-dev
          python -m pip install -e ".[dev]"
      - name: LLVM testleri
        run: python -m pytest -q tests/test_llvm.py tests/test_llvm_dwarf.py
      - name: Önceki minor release uyumluluk fixture'ları
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            python tools/check_compatibility_fixtures.py --require-current-release
          else
            python tools/check_compatibility_fixtures.py
          fi
      - name: Tüm örnekler LLVM ile derlenmeli
        run: |
          set -e
          for f in examples/*.ax; do
            echo "→ $f"
            if [[ "$f" == *"15_redteam_offensive_suite"* ]]; then
              ./bin/axiom build "$f" --backend=llvm --features offensive -o /tmp/out_llvm
            else
              ./bin/axiom build "$f" --backend=llvm -o /tmp/out_llvm
            fi
          done

  fmt:
    name: Biçimlendirme
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      # `bin/axiom` -> axiom/cli.py -> z3 import eder; z3 kurulmadan fmt-check duser.
      - name: Python bağımlılıkları
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: fmt --check
        run: make fmt-check
