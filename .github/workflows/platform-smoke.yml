name: Native platform smoke

on:
  push:
    branches: [main, master, develop]
  pull_request:

permissions:
  contents: read

jobs:
  native-smoke:
    name: Native build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Linux sistem bağımlılıkları
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang libssl-dev zlib1g-dev

      - name: Axiom kurulumu
        run: python -m pip install -e . pytest

      - name: Registry cache ve file URL platform smoke testleri
        run: >-
          python -m pytest -q tests/test_registry.py -k
          "download_cache_hit_is_portable_on_current_platform or
          fetch_reads_file_uri_with_escaped_spaces or
          fetch_rejects_remote_file_uri_host or
          fetch_index_reports_invalid_file_uri_as_registry_error"

      - name: Derleyici sürümünü doğrula
        run: |
          axiom --version
          clang --version

      - name: Derle ve çalıştır (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          axiom build examples/01_hello.ax --output "$RUNNER_TEMP/axiom-hello"
          python -c 'import os, subprocess; p=os.path.join(os.environ["RUNNER_TEMP"], "axiom-hello"); r=subprocess.run([p], check=True, capture_output=True, text=True); print(r.stdout); assert "[DOGRULAMA]" in r.stdout'
          axiom run examples/01_hello.ax

      - name: Derle ve çalıştır (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          axiom build examples/01_hello.ax --output "$env:RUNNER_TEMP\axiom-hello.exe"
          python -c 'import os, subprocess; p=os.path.join(os.environ["RUNNER_TEMP"], "axiom-hello.exe"); r=subprocess.run([p], check=True, capture_output=True, text=True); print(r.stdout); assert "[DOGRULAMA]" in r.stdout'
          axiom run examples/01_hello.ax
