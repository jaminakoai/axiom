name: Native platform smoke

on:
  push:
    branches: [main, master, develop]
  pull_request:

permissions:
  contents: read

jobs:
  native-smoke:
    name: Native build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Linux sistem bağımlılıkları
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang libssl-dev zlib1g-dev

      - name: Axiom kurulumu
        run: python -m pip install -e . pytest

      - name: macOS OpenSSL 3 PATH
        if: runner.os == 'macOS'
        run: echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"

      - name: Ed25519 için OpenSSL doğrula
        run: openssl version

      - name: Registry cache ve file URL platform smoke testleri
        run: >-
          python -m pytest -q tests/test_registry.py -k
          "download_cache_hit_is_portable_on_current_platform or
          fetch_reads_file_uri_with_escaped_spaces or
          fetch_rejects_remote_file_uri_host or
          fetch_index_reports_invalid_file_uri_as_registry_error or
          registry_index_state_lock_serializes_processes or
          signed_index_verifies_and_persists_accepted_sequence or
          signed_index_rejects_tampering_and_missing_trust_key or
          signed_index_rejects_rollback_and_same_sequence_equivocation or
          signed_index_rejects_expired_and_excessively_long_expiration"

      - name: Signed sample package release preflight
        run: >-
          python -m pytest -q
          tests/test_package_manager.py::test_sample_scan_report_signed_registry_release_preflight

      - name: Classic PCAP scanner smoke tests
        run: python -m pytest -q tests/test_axiom_scan.py -k pcap

      - name: axiom-scan onboarding sentinel smoke
        run: python -m pytest -q tests/test_axiom_scan.py::test_public_onboarding_sentinel

      - name: Derleyici sürümünü doğrula
        run: |
          axiom --version
          clang --version

      - name: Derle ve çalıştır (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          axiom build examples/01_hello.ax --output "$RUNNER_TEMP/axiom-hello"
          python -c 'import os, subprocess; p=os.path.join(os.environ["RUNNER_TEMP"], "axiom-hello"); r=subprocess.run([p], check=True, capture_output=True, text=True); print(r.stdout); assert "[DOGRULAMA]" in r.stdout'
          axiom run examples/01_hello.ax

      - name: Derle ve çalıştır (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          axiom build examples/01_hello.ax --output "$env:RUNNER_TEMP\axiom-hello.exe"
          python -c 'import os, subprocess; p=os.path.join(os.environ["RUNNER_TEMP"], "axiom-hello.exe"); r=subprocess.run([p], check=True, capture_output=True, text=True); print(r.stdout); assert "[DOGRULAMA]" in r.stdout'
          axiom run examples/01_hello.ax
